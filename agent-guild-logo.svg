<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#002147"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32"/>
      <stop offset="100%" style="stop-color:#E8A54A"/>
    </linearGradient>
  </defs>
  <!-- Shield/badge background -->
  <rect x="0" y="5" width="70" height="70" rx="12" fill="url(#bg)" stroke="#CD7F32" stroke-width="1.5"/>
  <!-- AG monogram -->
  <text x="35" y="52" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#CD7F32" text-anchor="middle" letter-spacing="1">AG</text>
  <!-- Small star accent -->
  <polygon points="35,10 37,17 44,17 38,22 40,29 35,24 30,29 32,22 26,17 33,17" fill="#FFFFFF" opacity="0.4"/>
  <!-- Text -->
  <text x="85" y="38" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="3">AGENT GUILD</text>
  <text x="85" y="56" font-family="'Inter', sans-serif" font-size="11" font-weight="300" fill="#CD7F32" letter-spacing="6" font-style="italic">BUILD YOUR AI ARMY</text>
</svg>