<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<!-- duration: 60s -->
<!-- note: npm install s postupnou animáciou spinnerov a úspešným výstupom -->
<title>L3 F2 – npm install -g prime-agent</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
    background: #0d1117;
    color: #c9d1d9;
    width: 1920px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}


.terminal-frame {
    width: 1700px; max-height: 960px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.terminal-titlebar {
    background: #21262d;
    padding: 14px 20px;
    display: flex; align-items: center;
    gap: 12px;
    border-bottom: 1px solid #30363d;
}
.terminal-titlebar .dots { display: flex; gap: 8px; }
.terminal-titlebar .dots i {
    display: block; width: 13px; height: 13px; border-radius: 50%;
}
.terminal-titlebar .dots i:nth-child(1) { background: #ff5f56; }
.terminal-titlebar .dots i:nth-child(2) { background: #ffbd2e; }
.terminal-titlebar .dots i:nth-child(3) { background: #27ca40; }
.terminal-titlebar .title {
    color: #8b949e; font-size: 15px; margin-left: 12px;
}
.terminal-body {
    padding: 28px 32px;
    font-size: 19px; line-height: 1.55;
    white-space: pre-wrap;
    color: #c9d1d9;
    min-height: 200px;
}
.terminal-body .prompt { color: #58a6ff; }
.terminal-body .cmd   { color: #79c0ff; font-weight: 600; }
.terminal-body .out   { color: #8b949e; }
.terminal-body .green { color: #3fb950; }
.terminal-body .yellow{ color: #d2991d; }
.terminal-body .red   { color: #f85149; }
.terminal-body .cyan  { color: #39d2c0; }
.terminal-body .hl    { background: rgba(88,166,255,0.15); padding: 2px 6px; border-radius: 3px; }

</style>
</head>
<body>

<div class="terminal-frame">
    <div class="terminal-titlebar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="title">Terminal — zsh</span>
    </div>
    <div class="terminal-body">

<span class="prompt">❯ </span><span class="cmd">npm install -g prime-agent</span>

<span class="out">⠋</span> <span class="out">⠙</span> <span class="out">⠹</span> <span class="out">⠸</span> <span class="out">⠼</span> <span class="out">⠴</span> <span class="out">⠦</span> <span class="out">⠧</span> <span class="out">⠇</span> <span class="out">⠏</span> <span class="green">✓</span>

<span class="green">pridaných 247 balíčkov za 8.3s</span>

<span class="out">→ 36 balíčkov hľadá financovanie</span>
<span class="out">  spusti \`npm fund\` pre detaily</span>

<span class="green">✅ prime-agent@2.14.1 nainštalovaný globálne</span>

    </div>
</div>
</body>
</html>
