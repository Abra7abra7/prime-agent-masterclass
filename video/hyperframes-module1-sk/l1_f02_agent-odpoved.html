<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<!-- duration: 55s -->
<!-- note: Chat rozhranie: používateľ položí otázku, agent robí audit -->
<title>L1 F2 – Agent odpovedá</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', monospace;
    background: #0d1117;
    color: #c9d1d9;
    width: 1920px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}


.split-container { width: 1400px; display: flex; flex-direction: column; gap: 28px; }
.chat-block { display: flex; align-items: flex-start; gap: 16px; }
.avatar { font-size: 42px; flex-shrink: 0; }
.bubble { max-width: 1100px; padding: 20px 28px; border-radius: 18px; font-size: 22px; line-height: 1.5; }
.user-msg { flex-direction: row; }
.agent-msg { flex-direction: row; margin-left: 0; }
.user-bubble { background: #1f6feb; color: #fff; border-bottom-left-radius: 4px; }
.agent-bubble { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-bottom-left-radius: 4px; }

</style>
</head>
<body>

<div class="split-container">
    <div class="chat-block user-msg">
        <div class="avatar">👤</div>
        <div class="bubble user-bubble">
            Optimalizuj mi marketingovú landing page – mám vysokú návštevnosť ale nízky conversion.
        </div>
    </div>
    <div class="chat-block agent-msg">
        <div class="avatar">🤖</div>
        <div class="bubble agent-bubble">
            🔍 Spúšťam audit stránky...<br>
            ✅ Analyzujem SEO, rýchlosť, copy, CTA<br>
            📊 Návrh: Zmena headline, 2 varianty A/B testu<br>
            ⚡ Odhad: +15–25 % konverzia
        </div>
    </div>
</div>

</body>
</html>
