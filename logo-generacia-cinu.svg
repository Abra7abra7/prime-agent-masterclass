<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8A54A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8732A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navy-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#002147;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle / shield -->
  <circle cx="200" cy="280" r="270" fill="url(#navy-grad)" stroke="#CD7F32" stroke-width="3"/>
  <circle cx="200" cy="280" r="250" fill="none" stroke="rgba(205,127,50,0.2)" stroke-width="1"/>

  <!-- Aero-Kybernetický Šíp -->
  <!-- Lipový list (base - Milovať) -->
  <g transform="translate(200, 420)">
    <!-- Lipový list - dva laloky -->
    <path d="M0,0 C-20,-30 -50,-60 -60,-80 C-70,-100 -40,-110 -20,-95 C-10,-88 0,-80 0,-80 C0,-80 10,-88 20,-95 C40,-110 70,-100 60,-80 C50,-60 20,-30 0,0Z" 
          fill="url(#bronze-grad)" opacity="0.9"/>
    <!-- Stred listu -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#CD7F32" stroke-width="1.5" opacity="0.5"/>
    <!-- Žilky -->
    <line x1="0" y1="-20" x2="-25" y2="-55" stroke="#CD7F32" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="-20" x2="25" y2="-55" stroke="#CD7F32" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Dve krídla (Budovať) -->
  <!-- Ľavé krídlo -->
  <g transform="translate(200, 320)">
    <path d="M0,0 C-20,-20 -60,-50 -120,-60 C-100,-40 -80,-25 -40,-15 L-10,-10 L0,0Z" 
          fill="url(#bronze-grad)" opacity="0.85"/>
    <path d="M-20,-10 C-50,-30 -90,-50 -120,-60 C-80,-40 -50,-20 -20,-10Z" 
          fill="url(#bronze-grad)" opacity="0.6"/>
    <!-- Aerodynamické prvky -->
    <line x1="0" y1="-5" x2="-60" y2="-40" stroke="#E8A54A" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="-10" x2="-40" y2="-30" stroke="#E8A54A" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Pravé krídlo -->
  <g transform="translate(200, 320)">
    <path d="M0,0 C20,-20 60,-50 120,-60 C100,-40 80,-25 40,-15 L10,-10 L0,0Z" 
          fill="url(#bronze-grad)" opacity="0.85"/>
    <path d="M20,-10 C50,-30 90,-50 120,-60 C80,-40 50,-20 20,-10Z" 
          fill="url(#bronze-grad)" opacity="0.6"/>
    <line x1="0" y1="-5" x2="60" y2="-40" stroke="#E8A54A" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="-10" x2="40" y2="-30" stroke="#E8A54A" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Šíp smerujúci nahor (spája krídla) -->
  <polygon points="200,300 190,160 200,120 210,160" 
           fill="url(#bronze-grad)" opacity="0.9" filter="url(#glow)"/>
  <polygon points="200,280 194,180 200,150 206,180" 
           fill="#E8A54A" opacity="0.5"/>

  <!-- Tri hviezdy (Veriť) - súhvezdie -->
  <!-- Hviezda 1 - vrch -->
  <g transform="translate(200, 80)" filter="url(#glow)">
    <polygon points="0,-18 4,-6 18,-6 7,2 10,16 0,8 -10,16 -7,2 -18,-6 -4,-6" 
             fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Hviezda 2 - vľavo dole -->
  <g transform="translate(160, 120)" filter="url(#glow)">
    <polygon points="0,-12 3,-4 12,-4 5,1 7,11 0,5 -7,11 -5,1 -12,-4 -3,-4" 
             fill="#FFFFFF" opacity="0.85"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Hviezda 3 - vpravo dole -->
  <g transform="translate(240, 120)" filter="url(#glow)">
    <polygon points="0,-12 3,-4 12,-4 5,1 7,11 0,5 -7,11 -5,1 -12,-4 -3,-4" 
             fill="#FFFFFF" opacity="0.85"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Spojnice medzi hviezdami (súhvezdie) -->
  <line x1="200" y1="80" x2="160" y2="120" stroke="#CD7F32" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="200" y1="80" x2="240" y2="120" stroke="#CD7F32" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="160" y1="120" x2="240" y2="120" stroke="#CD7F32" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Názov pod logom -->
  <text x="200" y="530" font-family="'Inter', sans-serif" font-size="24" font-weight="800" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GENERÁCIA ČINU</text>
  <text x="200" y="555" font-family="'Inter', sans-serif" font-size="14" font-weight="300" 
        fill="#CD7F32" text-anchor="middle" letter-spacing="8" font-style="italic">Veriť &nbsp;·&nbsp; Milovať &nbsp;·&nbsp; Budovať</text>
</svg>